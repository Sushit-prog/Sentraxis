name: Live correlation eval (nightly)

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily — off-peak, quota-friendly
  workflow_dispatch:

jobs:
  eval-live:
    runs-on: ubuntu-latest
    if: ${{ vars.LIVE_EVAL_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --frozen

      - name: Correlation golden-set gate (live)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost/ci
          REDIS_URL: redis://localhost:6379/0
        run: uv run python scripts/run_eval_correlation.py --require-keys --gate

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correlation-report
          path: docs/evaluation/correlation-report.md
